name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    name: markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Lint markdown
        # Pinned: an unpinned npx pulls whatever is latest at run time, so a
        # new upstream rule could fail a PR that changed nothing.
        run: npx --yes markdownlint-cli2@0.23.2 "**/*.md"

  # The spec is the source of truth; these guard invariants that are cheap to
  # check and expensive to notice by hand. See doc/spec.md.
  spec-guards:
    name: spec guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tenant identifier is bsuid, never wa_id
        run: |
          # git grep searches tracked files only: it never walks .git/, and -w
          # matches the whole identifier without relying on a GNU regex
          # extension. Exits 1 when nothing matches, so it does not block the
          # bootstrap PR that introduces this workflow.
          if git grep -nw 'wa_id' -- '*.md' '*.py'; then
            echo "::error::wa_id was replaced by bsuid (see doc/spec.md AD-02)"
            exit 1
          fi

  # Activates on its own once the Phase 1.0 scaffold lands. Until pyproject.toml
  # exists there is nothing to lint, type-check or test.
  detect:
    name: detect python
    runs-on: ubuntu-latest
    outputs:
      has_python: ${{ steps.check.outputs.has_python }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f pyproject.toml ]; then
            echo "has_python=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_python=false" >> "$GITHUB_OUTPUT"
            echo "No pyproject.toml yet; skipping Python jobs."
          fi

  python:
    name: lint, types and tests
    needs: detect
    if: needs.detect.outputs.has_python == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fittrack
          POSTGRES_PASSWORD: fittrack
          POSTGRES_DB: fittrack_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports: ['6333:6333']
    env:
      DATABASE_URL: postgresql+asyncpg://fittrack:fittrack@localhost:5432/fittrack_test
      REDIS_URL: redis://localhost:6379/0
      QDRANT_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Types
        run: mypy src evals
      - name: Tests
        # testcontainers starts its own Postgres; the service containers
        # above remain for suites that want a long-lived one.
        run: pytest -q
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

  # §21.4. The deterministic golden set is cheap and runs on every PR; the
  # judge costs 60 reasoning-tier calls a round, so it is gated on a diff that
  # could plausibly change model behaviour. An infrastructure PR skips it.
  evals:
    name: evals
    needs: detect
    if: needs.detect.outputs.has_python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The path filter below compares against the base commit, which a
          # shallow clone does not have.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - id: scope
        name: Does this diff touch model behaviour?
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then
            # A push to main: no base to diff against, so run everything.
            echo "judge=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -Eq \
              '^(config/prompts/|src/fittrack/agents/|src/fittrack/graph/|evals/)'; then
            echo "judge=true" >> "$GITHUB_OUTPUT"
          else
            echo "judge=false" >> "$GITHUB_OUTPUT"
            echo "No prompt, agent, graph or eval changes; skipping the judge."
          fi
      - name: Golden set
        run: python -m evals.run --suite golden
      - name: Judge
        if: steps.scope.outputs.judge == 'true'
        run: python -m evals.run --suite judge
