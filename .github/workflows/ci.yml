name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check repository formatting
        run: |
          if git grep -nI -E '[[:blank:]]+$' -- '*.nix' '.github/*.yml'; then
            echo 'Trailing whitespace found in executable configuration.' >&2
            exit 1
          fi

      - name: Validate Nix expressions
        run: |
          nix-instantiate --parse flake.nix >/dev/null
          nix-instantiate --parse shell.nix >/dev/null
          nix flake check --no-build

      - name: Cache uv downloads
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      # The devshell owns the interpreter and `make` owns the gates, so CI runs
      # exactly the commands a developer runs. Any duplication here would be a
      # second definition of "green".
      - name: Install dependencies
        run: nix develop --command make sync

      - name: Lint
        run: nix develop --command make lint

      - name: Typecheck
        run: nix develop --command make typecheck

      # Section 21.4 orders the gates by cost, and puts the architecture tests
      # first among the cheap ones: an `import` of `channels` inside a subgraph
      # takes seconds to detect and weeks to undo once three features sit on it.
      - name: Architecture guardrails
        run: nix develop --command make test-architecture

      - name: Unit tests
        run: nix develop --command make test

  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Section 21.4 orders the gates by cost: nothing starts a container until
    # lint, mypy and the unit and architecture tests are green.
    needs: quality

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The stack is the same one a developer runs, brought up from the same two
      # files. Service containers would be a second definition of the topology,
      # and the one that is not TLS-verified.
      - name: Generate development certificates
        run: ./scripts/gen_dev_certs.sh

      - name: Generate .env
        run: python3 scripts/init_dev_env.py

      - name: Validate the combined compose configuration
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet

      - name: Start the stack
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --wait

      # Tenant isolation needs a database, so it runs here rather than with the
      # cheap gates — and it runs first, because a leak between tenants is the
      # one failure the rest of the suite cannot compensate for.
      - name: Tenant isolation
        run: >-
          docker compose -f docker-compose.yml -f docker-compose.dev.yml
          run --rm worker pytest tests/test_tenant_isolation.py

      - name: Run the suite inside the worker
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml run --rm worker pytest

      - name: Service logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml down --volumes

  judge:
    name: LLM-as-judge
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # Section 21.4: the judge is a reasoning-tier sample of 60 calls per run,
      # so it only runs when the diff can actually change an agent's output.
      - name: Decide whether the judge applies
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA}" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo 'No usable base commit; running the judge.'
            exit 0
          fi
          changed=$(git diff --name-only "${BASE_SHA}" "${GITHUB_SHA}")
          echo "${changed}"
          if echo "${changed}" | grep -qE '^(config/models.yaml|config/prompts/|src/fittrack/agents/|src/fittrack/graph/|evals/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo 'Diff touches no prompt, agent, graph or eval path; skipping the judge.'
          fi

      - name: Install Nix
        if: steps.scope.outputs.run == 'true'
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Cache uv downloads
        if: steps.scope.outputs.run == 'true'
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: nix develop --command make sync

      # Blocks on safety and numeric fidelity below 5. An uncalibrated judge
      # discards its own round and reports without failing the PR.
      #
      # `--backend openai` is the strict mode, and it is deliberate: a diff
      # that touches a prompt, an agent or an eval must not get a green required
      # check from a judge that never ran. A missing OPENAI_API_KEY fails
      # here, which is the honest outcome — the tolerant local default lives in
      # `make eval-judge`.
      - name: Run the judge
        if: steps.scope.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: nix develop --command python -m evals.run_judge --backend openai
