[project]
name = "fittrack"
version = "0.1.0"
description = "WhatsApp multi-agent bot that turns natural language into structured workout data"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "arq>=0.26",
    "httpx>=0.28",
    "cryptography>=44.0",
    "python-dateutil>=2.9",
    "langgraph>=1.2",
    # The Postgres checkpointer is a separate distribution, and it brings
    # psycopg (v3) with it: the graph's own connection is sync-capable and
    # separate from SQLAlchemy's asyncpg engine.
    "langgraph-checkpoint-postgres>=3.1",
    "psycopg[binary,pool]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "testcontainers[postgres,redis]>=4.9",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fittrack"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# doc/ contém trechos ilustrativos de Python dentro de markdown, alguns
# deliberadamente pseudo-código. Formatá-los reescreveria a documentação.
extend-exclude = ["doc", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "SIM", "ARG", "RUF"]
ignore = ["E501"]  # line length is enforced by the formatter

[tool.ruff.lint.per-file-ignores]
# Fixtures are injected, not called; and a fake standing in for a real
# collaborator has to keep its parameter names, because the caller passes them
# by keyword. Renaming one to satisfy the linter breaks the call at runtime.
"tests/**" = ["ARG001", "ARG002"]
# LangGraph matches nodes against a Protocol whose parameter is named `state`,
# so renaming it to `_state` to satisfy ARG001 makes mypy reject the node.
# A node that does not read the state yet is a placeholder, not a mistake.
"src/fittrack/graph/**" = ["ARG001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "arq.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = ["integration: needs containers (deselect with '-m \"not integration\"')"]
