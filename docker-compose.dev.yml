# Local override. It adds ergonomics and nothing else: ports on the host, the
# image target that carries the test toolchain, and the source tree mounted so
# an edit does not need a rebuild.
#
# Never deploy with this file. Every port it opens is closed in the base file on
# purpose (spec 3.1).

services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  qdrant:
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"

  langfuse:
    ports:
      - "127.0.0.1:3000:3000"

  ingress:
    build:
      context: .
      target: dev
    # One of each locally: a published host port cannot be shared by two
    # replicas, and a second worker only makes the logs harder to read.
    # It is also what makes `TELEGRAM_MODE=polling` safe to run at all — two
    # pollers on the same bot collide on `getUpdates` (spec 18.2).
    deploy:
      replicas: 1
    # The only file that lets the operator's `.env` choose polling: the base
    # file hardcodes `webhook` for the production topology (S02-T08).
    environment:
      TELEGRAM_MODE: ${TELEGRAM_MODE}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - type: bind
        source: ./certs/ca/ca.crt
        target: /certs/ca.crt
        read_only: true
        bind: { create_host_path: false }
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./evals:/app/evals:ro
      - ./scripts:/app/scripts:ro
      - ./config:/app/config:ro
      - ./docker-compose.yml:/app/docker-compose.yml:ro
      - ./docker-compose.dev.yml:/app/docker-compose.dev.yml:ro
      - ./Caddyfile:/app/Caddyfile:ro
      - ./Dockerfile:/app/Dockerfile:ro
      - ./.env.example:/app/.env.example:ro
      - ./alembic.ini:/app/alembic.ini:ro

  worker:
    build:
      context: .
      target: dev
    deploy:
      replicas: 1
    # Test-only credentials. The integration suite proves the TLS boundary of
    # every store and runs migrations, so it needs both the store passwords and
    # the owner principal — none of which production gives an application
    # container. This is the file that exists to be local-only, so it is the
    # right place; the base file stays clean and the contract test reads only
    # that.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      FITTRACK_RUNTIME_PASSWORD: ${FITTRACK_RUNTIME_PASSWORD}
      # Every service validates the whole environment at startup
      # (fittrack.startup); the worker has to agree with the ingress about the
      # mode or `Settings` refuses to boot it (S02-T08).
      TELEGRAM_MODE: ${TELEGRAM_MODE}
    volumes:
      - type: bind
        source: ./certs/ca/ca.crt
        target: /certs/ca.crt
        read_only: true
        bind: { create_host_path: false }
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./evals:/app/evals:ro
      - ./scripts:/app/scripts:ro
      - ./config:/app/config:ro
      - ./docker-compose.yml:/app/docker-compose.yml:ro
      - ./docker-compose.dev.yml:/app/docker-compose.dev.yml:ro
      - ./Caddyfile:/app/Caddyfile:ro
      - ./Dockerfile:/app/Dockerfile:ro
      - ./.env.example:/app/.env.example:ro
      - ./alembic.ini:/app/alembic.ini:ro

  scheduler:
    build:
      context: .
      target: dev
    environment:
      TELEGRAM_MODE: ${TELEGRAM_MODE}
    volumes:
      - type: bind
        source: ./certs/ca/ca.crt
        target: /certs/ca.crt
        read_only: true
        bind: { create_host_path: false }
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./evals:/app/evals:ro
      - ./scripts:/app/scripts:ro
      - ./config:/app/config:ro
      - ./docker-compose.yml:/app/docker-compose.yml:ro
      - ./docker-compose.dev.yml:/app/docker-compose.dev.yml:ro
      - ./Caddyfile:/app/Caddyfile:ro
      - ./Dockerfile:/app/Dockerfile:ro
      - ./.env.example:/app/.env.example:ro
      - ./alembic.ini:/app/alembic.ini:ro
