# Alembic. The URL is deliberately absent: `env.py` reads it from settings, so
# there is exactly one place a connection string lives and it is never a file
# that could be committed with a password in it.

[alembic]
script_location = src/fittrack/db/migrations
prepend_sys_path = src
path_separator = os
# Migration files sort by their numeric prefix, which is also their order.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
