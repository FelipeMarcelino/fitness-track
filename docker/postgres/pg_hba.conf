# TLS is not optional on the network (spec 22.1). `hostssl` is the line that
# makes it true: with the stock `host` rules, `ssl=on` only *offers* TLS and a
# client that asks for plaintext still gets in.
#
# The local socket stays open without TLS so the container's own healthcheck
# (`pg_isready`) and the initdb scripts work.

# TYPE    DATABASE  USER  ADDRESS       METHOD
local     all       all                 trust
hostssl   all       all   0.0.0.0/0     scram-sha-256
hostssl   all       all   ::/0          scram-sha-256
